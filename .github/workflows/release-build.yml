name: Release Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Version
        run: |
          echo "VERSION=$(date -d "8 hour" -u +3.%y.%m%d)" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Release Apk Sign
        run: |
          echo "使用仓库内置jks签名"
          echo -e "\n" >> gradle.properties
          cp $GITHUB_WORKSPACE/.github/workflows/legado.jks $GITHUB_WORKSPACE/app/legado.jks
          echo RELEASE_KEY_ALIAS="legado" >> gradle.properties
          echo RELEASE_KEY_PASSWORD="gedoor_legado" >> gradle.properties
          echo RELEASE_STORE_PASSWORD="gedoor_legado" >> gradle.properties
          echo RELEASE_STORE_FILE='./legado.jks' >> gradle.properties

      - name: Unify Version Name
        run: |
          echo "统一版本号"
          sed "/def version/c def version = \"${{ env.VERSION }}\"" $GITHUB_WORKSPACE/app/build.gradle  -i

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release (原包名)
        run: |
          echo "开始app原包名构建"
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleapprelease --build-cache --parallel --daemon --warning-mode all 2>&1 | tee build.log
          mkdir -p ${{ github.workspace }}/apk/
          find ${{ github.workspace }}/app/build/outputs/apk -name "*.apk" -exec mv {} ${{ github.workspace }}/apk/ \;

      - name: Report Compile Errors
        if: failure()
        run: |
          grep -E "^e: |error: |AAPT|Duplicate class|Could not (resolve|find)|FAILURE|Caused by:|What went wrong|OutOfMemory|daemon" build.log 2>/dev/null | head -150 > compile_errors.txt || true
          echo "===== 日志尾部 =====" >> compile_errors.txt
          tail -60 build.log >> compile_errors.txt 2>/dev/null || true
          if [ -s compile_errors.txt ]; then
            gh issue create --title "构建错误日志 $(date '+%m%d-%H%M')" --body-file compile_errors.txt || true
          else
            gh issue create --title "构建失败 $(date '+%m%d-%H%M')" --body "见 Actions 运行日志（无捕获到编译错误行）" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ReleaseA (共存)
        continue-on-error: true
        run: |
          echo "修改applicationIdSuffix为共存版"
          sed "s/'.release'/'.releaseA'/" $GITHUB_WORKSPACE/app/build.gradle -i
          echo "开始app共存构建"
          set -o pipefail
          ./gradlew assembleapprelease --build-cache --parallel --daemon --warning-mode all 2>&1 | tee -a build.log
          find ${{ github.workspace }}/app/build/outputs/apk -name "*.apk" -exec mv {} ${{ github.workspace }}/apk/ \;

      - name: Generate Release Notes
        run: |
          echo "## 更新日志" > ${{ github.workspace }}/RELEASE_NOTES.md
          echo "" >> ${{ github.workspace }}/RELEASE_NOTES.md
          COMMITS=$(git log --since="15 days ago" --pretty=format:"- %<(72,trunc)%s (%h)")
          OLDEST=$(git log --since="15 days ago" --format="%H" | tail -1)
          BASE=$(git rev-parse "${OLDEST}^" 2>/dev/null || echo "$OLDEST")
          COMPARE_URL="https://github.com/${{ github.repository }}/compare/${BASE}...HEAD"

          if [ -n "$COMMITS" ]; then
            echo "$COMMITS" | head -25 >> ${{ github.workspace }}/RELEASE_NOTES.md
            TOTAL=$(echo "$COMMITS" | wc -l)
            if [ "$TOTAL" -gt 25 ]; then
              echo "- *……还有 $((TOTAL - 25)) 条提交未显示*" >> ${{ github.workspace }}/RELEASE_NOTES.md
            fi
            echo "" >> ${{ github.workspace }}/RELEASE_NOTES.md
            echo "[查看完整提交记录 →](${COMPARE_URL})" >> ${{ github.workspace }}/RELEASE_NOTES.md
          else
            echo "- 定期维护编译，无代码变更。" >> ${{ github.workspace }}/RELEASE_NOTES.md
          fi
          cat ${{ github.workspace }}/RELEASE_NOTES.md

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ${{ github.workspace }}/apk/*.apk

      - name: Delete Old Release
        continue-on-error: true
        run: gh release delete "${{ env.VERSION }}" -y --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ env.VERSION }}
          tag: ${{ env.VERSION }}
          bodyFile: ${{ github.workspace }}/RELEASE_NOTES.md
          artifacts: ${{ github.workspace }}/apk/*.apk
          allowUpdates: true
          replacesArtifacts: true
          draft: false
          prerelease: false

      - name: Mark As Latest
        continue-on-error: true
        run: |
          RID=$(gh api "repos/${{ github.repository }}/releases/tags/${{ env.VERSION }}" -q .id)
          gh api -X PATCH "repos/${{ github.repository }}/releases/$RID" -F make_latest=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Old Beta Release
        continue-on-error: true
        run: gh release delete beta -y --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Beta Channel
        uses: ncipollo/release-action@v1
        with:
          name: ${{ env.VERSION }}
          tag: beta
          body: Beta 通道滚动发版，内容与最新 Release 一致（共存版检查更新用）
          artifacts: ${{ github.workspace }}/apk/*.apk
          allowUpdates: true
          replacesArtifacts: true
          draft: false
          prerelease: true
